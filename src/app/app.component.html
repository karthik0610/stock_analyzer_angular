<app-header [activeScreen]="activeScreen" (activeScreenChange)="activeScreen = $event" />

@if (activeScreen === 'auto-trade') {
  <main class="dashboard" aria-label="Stock Analyzer dashboard">
    <app-watchlist class="dashboard-panel" />
    <app-top-stocks class="dashboard-panel" />
    <app-trading-rules class="dashboard-panel" />
    <app-finalized-stocks class="dashboard-panel" />
    <app-stock-analysis class="dashboard-panel" />
  </main>
} @else if (activeScreen === 'result-analysis') {
  <app-result-analysis />
} @else {
  <app-fundamental-analysis />
}
