<section class="rules">
  <header class="rules-heading">
    <h2><span class="target">◎</span> Trading Rules</h2>
    <p>Enable / Disable rules and run scanner to get final stocks.</p>
  </header>

  <div class="rule-list">
    @for (rule of rules; track rule.name) {
      <label class="rule">
        <span class="rule-mark">{{ rule.enabled ? '◴' : '○' }}</span>
        <span class="rule-copy"><strong>{{ rule.name }}</strong>@if (rule.detail) { <small>{{ rule.detail }}</small> }</span>
        <input type="checkbox" [checked]="rule.enabled" [attr.aria-label]="rule.name" />
      </label>
    }
  </div>

  <footer>
    <button class="run-button" (click)="runScanner()"><span>▷</span> Run Scanner</button>
    <p class="active"><span>✓</span> Active Rules: 9 / 10</p>
    <p class="last-run"><span>◷</span> {{ hasRun ? 'Scan complete: 4 stocks found' : 'Last Run: 04 Nov 2026, 01:05 PM' }}</p>
  </footer>
</section>
